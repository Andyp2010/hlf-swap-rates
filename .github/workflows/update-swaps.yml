name: Update NZ Wholesale Swap Rates

on:
  workflow_dispatch:
  schedule:
    # Run 1: 22:23 UTC = 11:23 AM NZDT / 10:23 AM Fiji (catches morning RBNZ upload)
    - cron: '23 22 * * *'
    # Run 2: 02:37 UTC = 3:37 PM NZDT / 2:37 PM Fiji (catches 3:00 PM RBNZ release window)
    - cron: '37 2 * * *'

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pandas openpyxl requests; fi

      - name: Fetch RBNZ Table B2 & rebuild outputs
        run: python update_swaps.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No file changes to commit."
          else
            git commit -m "Auto-update RBNZ Table B2 swap rates ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
