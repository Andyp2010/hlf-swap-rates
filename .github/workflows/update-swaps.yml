name: Update NZ Wholesale Swap Rates

on:
  workflow_dispatch:
  schedule:
    # 1) 02:23 UTC = 3:23 PM NZDT (2:23 PM Fiji) — catches 3:00 PM RBNZ release during NZ Daylight Saving
    - cron: '23 2 * * *'
    # 2) 03:37 UTC = 3:37 PM NZST / 4:37 PM NZDT (3:37 PM Fiji) — catches winter 3:00 PM release + late uploads
    - cron: '37 3 * * *'
    # 3) 05:17 UTC = 6:17 PM NZDT (5:17 PM Fiji) — evening backup safety net
    - cron: '17 5 * * *'

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pandas openpyxl requests; fi

      - name: Fetch RBNZ Table B2 & rebuild outputs
        run: python update_swaps.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No file changes to commit."
          else
            git commit -m "Auto-update RBNZ Table B2 swap rates ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
