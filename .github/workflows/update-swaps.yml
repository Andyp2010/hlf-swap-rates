name: Update NZ Wholesale Swap Rates

on:
  workflow_dispatch:
  schedule:
    # 02:23 UTC = 2:23 PM Fiji / 3:23 PM NZDT (catches 3:00 PM NZDT RBNZ release)
    - cron: '23 2 * * *'
    # 03:37 UTC = 3:37 PM Fiji / 4:37 PM NZDT / 3:37 PM NZST winter
    - cron: '37 3 * * *'
    # 06:47 UTC = 6:47 PM Fiji / 7:47 PM NZDT (evening backup — will also auto-fire tonight)
    - cron: '47 6 * * *'

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages & Playwright Chromium
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas openpyxl requests playwright
          python -m playwright install --with-deps chromium

      - name: Fetch RBNZ Table B2 & rebuild outputs
        run: python update_swaps.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No file changes to commit."
          else
            git commit -m "Auto-update RBNZ Table B2 swap rates ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
