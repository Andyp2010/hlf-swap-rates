name: Update NZ Wholesale Swap Rates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.xlsx'
  schedule:
    # 1) 02:14 UTC = 3:14 PM NZDT (2:14 PM Fiji) — catches 3:00 PM summer release fast
    - cron: '14 2 * * 1-5'
    # 2) 02:42 UTC = 3:42 PM NZDT (2:42 PM Fiji) — catches slightly late summer uploads
    - cron: '42 2 * * 1-5'
    # 3) 03:18 UTC = 4:18 PM NZDT / 3:18 PM NZST & Fiji — catches winter 3:00 PM release
    - cron: '18 3 * * 1-5'
    # 4) 04:23 UTC = 5:23 PM NZDT / 4:23 PM NZST & Fiji — close-of-business backup
    - cron: '23 4 * * 1-5'
    # 5) 07:17 UTC = 8:17 PM NZDT / 7:17 PM NZST & Fiji — evening safety net
    - cron: '17 7 * * 1-5'

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install anti-detect browsers & virtual display
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libasound2t64 libx11-xcb1 || sudo apt-get install -y xvfb
          pip install pandas openpyxl requests curl_cffi "camoufox[geoip]" playwright
          python -m camoufox fetch
          python -m playwright install chromium

      - name: Fetch RBNZ Table B2 & rebuild outputs
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python update_swaps.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nz-swap-rates.json index.html
          if git diff --staged --quiet; then
            echo "No file changes to commit."
          else
            git commit -m "Auto-update RBNZ Table B2 swap rates ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
